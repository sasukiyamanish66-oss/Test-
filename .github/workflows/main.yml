name: Build TEST MITRA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -type f -name "gradlew" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found."
            echo "Checking extracted files:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build TEST MITRA APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
